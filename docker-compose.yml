# Optional. Redis backs LangGraph checkpointing so a run that dies partway
# through can resume instead of re-paying for every LLM call before the
# failure. Not required for local development.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
